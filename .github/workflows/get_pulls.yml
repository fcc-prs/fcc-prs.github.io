name: get fcc pull requests

on:
  schedule:
    # Runs at 02:00 UTC every day
    - cron: '0 2 * * *'
  # Allows you to manually trigger the action anytime from the GitHub Actions tab
  workflow_dispatch:

jobs:
  update_prs:
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository to the runner
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Install Python dependencies
        run: pip install pyyaml
      - name: Fetch pull requests
        run: python3 assets/scripts/fetch_prs.py config.yml
        env:
          GH_TOKEN: ${{ secrets.FCC_GH_TOKEN }}
      - name: Write timestamp
        run: |
          printf '{"updated_at": "%s"}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > assets/json/last_updated.json
      - name: Process JSON
        run: |
          python3 assets/scripts/reformulate_json.py all_prs.json
          mv data.json assets/json/sample.json
          mv repo_data.json assets/json/.
          rm all_prs.json
      - name: Push changes
        uses: stefanzweifel/git-auto-commit-action@v7

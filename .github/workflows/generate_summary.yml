name: generate weekly PR summary

on:
  schedule:
    # Runs daily at 07:00 UTC (~8am CET / 9am CEST), one hour after the merged PR fetch
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  generate_summary:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository to the runner
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Install Python dependencies
        run: pip install anthropic
      - name: Generate summary
        run: |
          EXTRA=""
          # Save snapshot only on Monday scheduled runs
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date +%u)" = "1" ]; then EXTRA="--scheduled"; fi
          python3 assets/scripts/generate_summary.py $EXTRA
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      - name: Push changes
        uses: stefanzweifel/git-auto-commit-action@v7

name: get recently merged pull requests

on:
  schedule:
    # Runs once a day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update_merged_prs:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository to the runner
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Install Python dependencies
        run: pip install pyyaml
      - name: Fetch merged pull requests
        run: python3 assets/scripts/fetch_merged_prs.py config.yml
        env:
          GH_TOKEN: ${{ secrets.FCC_GH_TOKEN }}
      - name: Format JSON
        run: |
          python3 assets/scripts/format_merged_json.py all_merged_prs.json
          mv merged_data.json assets/json/.
          rm all_merged_prs.json
      - name: Push changes
        uses: stefanzweifel/git-auto-commit-action@v7
